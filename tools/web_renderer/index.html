<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuestionX — render check</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    /* phone palette (detail_screen dark theme) */
    --bg:#0B1120; --card:#111827; --card2:#0F172A; --line:#1E293B;
    --text:#E5E7EB; --muted:#94A3B8; --accent:#38BDF8; --good:#22C55E; --warn:#F59E0B; --bad:#EF4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.6}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:10;background:rgba(11,17,32,.96);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-family:"Poppins",sans-serif;font-size:16px;margin:0;font-weight:600}
  #status{color:var(--muted);font-size:13px}
  .release-info{font-size:12px;padding:5px 10px;border-radius:8px;margin:4px 0;
    background:rgba(56,189,248,.08);color:var(--accent);border:1px solid rgba(56,189,248,.2)}
  .release-info.warn{background:rgba(245,158,11,.08);color:#FCD34D;border-color:rgba(245,158,11,.3)}
  .release-info a{color:var(--accent);text-decoration:underline}
  .parity{font-size:12.5px;padding:6px 10px;border-radius:8px;margin:4px 0}
  .parity.ok{background:rgba(34,197,94,.12);color:#86EFAC;border:1px solid rgba(34,197,94,.35)}
  .parity.fail{background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.4)}
  .parity ul{margin:6px 0 0 16px;padding:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  select,input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
  input[type=text]{min-width:240px}
  .filters label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .pager{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted)}
  button{cursor:pointer;background:var(--card2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit}
  button:disabled{opacity:.4;cursor:default}

  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:16px}
  .card.flagged{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
  .card.has-fallback{border-left:3px solid var(--bad)}
  .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
  .qid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--accent);
    background:rgba(56,189,248,.1);padding:2px 7px;border-radius:6px}
  .chip{font-size:11.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
    padding:2px 7px;border-radius:6px}
  .chip.type{color:#C4B5FD;border-color:rgba(196,181,253,.3)}
  .flagbtn{margin-left:auto;font-size:12px;padding:4px 10px}
  .flagbtn.on{background:rgba(245,158,11,.15);border-color:var(--warn);color:#FCD34D}

  .field{margin:10px 0}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .sol-diagram-label{margin-top:12px;color:#FCD34D}
  .badge-fallback{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.4);
    border-radius:6px;padding:1px 6px;font-size:10.5px;text-transform:none;letter-spacing:0}
  .texfield{}
  .texfield .plain{white-space:pre-wrap}
  /* Phone lays text + math in one inline Wrap, so BOTH math kinds flow inline
     (they wrap to the next line only when too wide, matching the Wrap). */
  .math-inline,.math-display{display:inline-block;vertical-align:middle;overflow-x:auto;max-width:100%}
  .math-display .katex-display{display:inline-block;margin:0;text-align:left;vertical-align:middle}
  .math-fallback{color:#FCD34D;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;
    background:rgba(245,158,11,.08);padding:0 3px;border-radius:4px}

  .diagram{margin:10px 0;background:#fff;border-radius:10px;padding:8px;text-align:center}
  .diagram img{max-width:100%;height:auto;display:inline-block}
  .diagram.img-missing{background:rgba(239,68,68,.1);color:#FCA5A5;padding:14px;font-size:13px}

  .options{margin:10px 0;display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;align-items:flex-start;gap:9px;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px}
  .opt.correct{border-color:var(--good);background:rgba(34,197,94,.08)}
  .optlabel{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .opt.correct .optlabel{background:var(--good);color:#052e16}
  .tick{margin-left:auto;color:var(--good);font-weight:700}

  .answer{margin:10px 0;font-size:14px;color:#BBF7D0}

  #flagbar{position:fixed;right:16px;bottom:16px;z-index:20;display:none;gap:8px;align-items:center;
    background:var(--card);border:1px solid var(--warn);border-radius:12px;padding:8px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #flagbar .n{font-weight:700;color:#FCD34D}

  #bookmarkbar{position:fixed;left:16px;bottom:16px;z-index:20;display:flex;gap:8px;align-items:center;
    background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px}
  #bookmarkbar button{font-size:12px;padding:4px 10px}
  #bm-info{color:var(--muted);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>QuestionX · render check</h1>
    <span id="status">starting…</span>
  </div>
  <div id="release-info" class="release-info" style="display:none">checking release…</div>
  <div id="parity" class="parity">running parity self-test…</div>
  <div class="filters">
    <select id="f-exam"><option value="">All exams</option></select>
    <select id="f-subject"><option value="">All subjects</option></select>
    <select id="f-year"><option value="">All years</option></select>
    <input id="f-search" type="text" placeholder="search id / text…" />
    <label><input type="checkbox" id="f-flagged" /> flagged only</label>
    <label><input type="checkbox" id="f-diagram" /> has Q diagram</label>
    <label><input type="checkbox" id="f-sol-diagram" /> has Sol diagram</label>
  </div>
  <div class="pager">
    <button id="prev">‹ prev</button>
    <button id="next">next ›</button>
    <span id="count"></span>
  </div>
</header>

<main><div id="list"></div></main>

<div id="flagbar">
  <span>🚩 <span class="n" id="flag-count">0</span> flagged</span>
  <button id="copy-ids">copy IDs</button>
  <button id="copy-json">copy JSON</button>
  <button id="clear-flags">clear</button>
</div>

<div id="bookmarkbar">
  <button id="bm-save">📌 save position</button>
  <button id="bm-restore">↩ resume</button>
  <span id="bm-info">no bookmark</span>
  <button id="bm-clear" style="font-size:11px;padding:3px 6px;opacity:.6">✕</button>
</div>

<script src="crypto.js"></script>
<script src="pipeline.js"></script>
<script src="parity-tests.js"></script>
<script src="app.js"></script>
</body>
</html>
